kotlin.code.style=official
org.gradle.jvmargs=-Xmx4096M -Djava.awt.headless=true

org.jetbrains.dokka.experimental.gradle.pluginMode.nowarn=true
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true

# Corporate proxy settings (optional)
#
# Gradle may require proxy access to download dependencies from external repositories.
# If you are working on the corporate network and experience connectivity issues,
# configure the proxy settings below using the values provided by your IT department.
#
# Example:
# systemProp.http.proxyHost=cloudproxy.yourdomain.com
# systemProp.http.proxyPort=8080
# systemProp.https.proxyHost=cloudproxy.yourdomain.com
# systemProp.https.proxyPort=8080

# If your proxy requires authentication, you can also configure:

# systemProp.http.proxyUser=<username>
# systemProp.http.proxyPassword=<password>
# systemProp.https.proxyUser=<username>
# systemProp.https.proxyPassword=<password>
